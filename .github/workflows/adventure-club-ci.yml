name: Adventure Club CI

on:
  push:
    branches:
      - build/adventure-club-app
    paths:
      - "club-app/**"
      - ".github/workflows/adventure-club-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: club-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and build
        run: npm run build

      - name: Commit lockfile if changed
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add club-app/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock Adventure Club dependencies"
            git push
          fi
