name: Adventure Club CI

on:
  push:
    branches:
      - build/adventure-club-app
    paths:
      - "club-app/**"
      - "supabase/functions/**"
      - ".github/workflows/adventure-club-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: club-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and build
        run: npm run build

      - name: Progress regression checks
        run: npm test

      - name: Check Edge Function syntax
        run: >-
          ./node_modules/.bin/tsc --ignoreConfig --noEmit --noCheck --noResolve
          --skipLibCheck --target es2022 --module esnext
          ../supabase/functions/*/index.ts
